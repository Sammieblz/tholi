name: Validate offline navigation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  THOLI_TEST_TIER: pr
  THOLI_VALIDATION_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  build:
    outputs:
      artifact_name: pr-build-${{ github.run_attempt }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          assets: "true"
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/build-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pr-build-${{ github.run_attempt }}
          path: |
            dist
            apps/api/dist
            assets/models
            assets/ocr
            output/build-manifest.json
  tests:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [core, ui, integration, firefox, unit]
    env:
      THOLI_BUILD_PREPARED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
      - run: node scripts/build-manifest.mjs --verify
      - run: npx playwright install chromium
        if: contains(fromJSON('["core", "integration", "live", "acceptance"]'), matrix.group)
      - run: npx playwright install chromium firefox
        if: matrix.group == 'ui'
      - uses: actions/cache@v4
        if: contains(fromJSON('["firefox", "brands", "browser-performance", "acceptance"]'), matrix.group)
        with:
          path: ~/.cache/selenium
          key: ${{ runner.os }}-selenium-${{ hashFiles('config/testing/browser-tools.json', 'package-lock.json') }}-${{ matrix.group }}
          restore-keys: ${{ runner.os }}-selenium-${{ hashFiles('config/testing/browser-tools.json', 'package-lock.json') }}-
      - run: npm run test:ci -- --group ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-evidence-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            output/qa
            output/acceptance/e2e-regressions.json
            output/nlp/browser-build.json
            output/multi-app/browser.json
            output/vision/browser.json
            output/reliability/browser.json
            test-results
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm run test:local-stack -- --optional
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-evidence-containers-${{ github.run_attempt }}
          path: output/qa/local-stack/**/smoke.json
  validate:
    if: always()
    needs: [build, tests, containers]
    runs-on: windows-latest
    steps:
      - name: Require every fast gate
        shell: pwsh
        run: |
          if ('${{ needs.build.result }}' -ne 'success' -or '${{ needs.tests.result }}' -ne 'success' -or '${{ needs.containers.result }}' -ne 'success') { exit 1 }

name: Full validation
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Package candidates after full verification
        type: boolean
        default: false
      website:
        description: Publish the website release after certification
        type: boolean
        default: false
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  THOLI_TEST_TIER: full
  THOLI_VALIDATION_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  build:
    outputs:
      artifact_name: full-build-${{ github.run_attempt }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          assets: "true"
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/build-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: full-build-${{ github.run_attempt }}
          path: |
            dist
            apps/api/dist
            assets/models
            assets/ocr
            output/build-manifest.json
            output/deploy/website
  tests:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - group: acceptance-chromium
            evidence: |
              output/acceptance/results.json
          - group: acceptance-firefox
            evidence: |
              output/acceptance/results-firefox.json
          - group: browser-performance
            evidence: |
              output/qa/browser-performance.json
          - group: brands
            evidence: |
              output/qa/branded-build.json
          - group: firefox
            evidence: |
              output/qa/firefox-build.json
          - group: live
            evidence: |
              output/acceptance/live-regressions.json
          - group: core
            evidence: |
              output/acceptance/e2e-regressions.json
          - group: models
            evidence: |
              output/nlp/results.json
              output/multi-app/model.json
              output/multi-app/runtime.json
              output/vision/runtime.json
              output/vision/routes.json
              output/vision/performance.json
          - group: ui
            evidence: |
              output/qa/ui-build.json
          - group: integration
            evidence: |
              output/nlp/browser-build.json
              output/multi-app/browser.json
              output/multi-app/performance.json
              output/vision/browser.json
              output/reliability
          - group: unit
            evidence: |
              output/qa/unit.json
    env:
      THOLI_BUILD_PREPARED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
      - run: node scripts/build-manifest.mjs --verify
      - run: npx playwright install chromium
        if: contains(fromJSON('["core", "integration", "live", "acceptance-chromium"]'), matrix.group)
      - run: npx playwright install chromium firefox
        if: matrix.group == 'ui'
      - uses: actions/cache@v4
        if: contains(fromJSON('["firefox", "brands", "browser-performance", "acceptance-firefox"]'), matrix.group)
        with:
          path: ~/.cache/selenium
          key: ${{ runner.os }}-selenium-${{ hashFiles('config/testing/browser-tools.json', 'package-lock.json') }}-${{ matrix.group }}
          restore-keys: ${{ runner.os }}-selenium-${{ hashFiles('config/testing/browser-tools.json', 'package-lock.json') }}-
      - uses: actions/cache@v4
        if: matrix.group == 'brands'
        with:
          path: output/browser-tools
          key: ${{ runner.os }}-browser-tools-${{ hashFiles('config/testing/browser-tools.json') }}
      - run: npm run fetch:browser-tools
        if: matrix.group == 'brands'
      - run: npm run test:full -- --group ${{ matrix.group }}
      - name: Require complete owner evidence
        shell: pwsh
        env:
          THOLI_OWNER_EVIDENCE: ${{ matrix.evidence }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($evidencePath in ($env:THOLI_OWNER_EVIDENCE -split '\r?\n')) {
            $evidencePath = $evidencePath.Trim()
            if ($evidencePath -and -not (Test-Path -LiteralPath $evidencePath)) {
              throw "Missing required owner evidence: $evidencePath"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-evidence-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.evidence }}
            output/build-manifest.json
            output/qa/timing-full-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-traces-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results
  certify:
    needs: [build, tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
      - uses: actions/download-artifact@v4
        with:
          path: output
          pattern: full-evidence-*-${{ github.run_attempt }}
          merge-multiple: true
      - run: node scripts/build-manifest.mjs --verify
      - run: node scripts/verify-full.mjs
      - run: npm run package:extension
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package == true
      - run: npm run package:api
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package == true
      - uses: actions/upload-artifact@v4
        with:
          name: full-validation-evidence-${{ github.run_attempt }}
          path: |
            output
  publish-website:
    needs: [build, tests, certify]
    if: inputs.website == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: website-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run check:website
      - name: Check immutable website tag
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $websiteVersion = (Get-Content apps/web/release.json -Raw | ConvertFrom-Json).version
          $websiteTag = "web-v$websiteVersion"
          $existingRefs = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$websiteTag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect website release tags' }
          $exists = @($existingRefs | Where-Object { $_.ref -eq "refs/tags/$websiteTag" }).Count -gt 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$websiteVersion" >> $env:GITHUB_OUTPUT
          "tag=$websiteTag" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host 'Website tag already exists; leaving its release and assets unchanged.' }
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.exists != 'true'
        with:
          name: ${{ needs.build.outputs.artifact_name }}
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.exists != 'true'
        with:
          name: full-validation-evidence-${{ github.run_attempt }}
          path: output
      - run: npm run package:website
        if: steps.release.outputs.exists != 'true'
      - name: Publish tested website assets
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_VERSION: ${{ steps.release.outputs.version }}
          WEBSITE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stem = "output/releases/tholi-web-$env:WEBSITE_VERSION"
          $notes = "docs/releases/website/v$env:WEBSITE_VERSION/README.md"
          $preparedNotes = Get-Content $notes -Raw
          $changesStart = $preparedNotes.IndexOf('## Changes')
          $validationStart = $preparedNotes.IndexOf('## Validation')
          if ($changesStart -lt 0 -or $validationStart -le $changesStart) { throw 'Website release notes are incomplete' }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $publishedNotes = "# Tholi website $env:WEBSITE_VERSION`n`nPublished from commit $env:GITHUB_SHA after complete [Full validation]($runUrl).`n`n"
          $publishedNotes += $preparedNotes.Substring($changesStart, $validationStart - $changesStart)
          $publishedNotes += "`n## Validation`n`nFull certification passed for this exact source and build. The attached JSON records the run identity and per-file hashes. Native permissions, screen-reader and signed-in checks remain separate. Cloudflare deployment is a later step.`n"
          $bodyPath = Join-Path $env:RUNNER_TEMP 'tholi-website-release.md'
          Set-Content -LiteralPath $bodyPath -Value $publishedNotes -Encoding utf8
          gh release create $env:WEBSITE_TAG "$stem.zip" "$stem.json" "$stem.zip.sha256" --target $env:GITHUB_SHA --title "Tholi website $env:WEBSITE_VERSION" --notes-file $bodyPath --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Website publication failed; inspect the tag and assets before retrying.' }

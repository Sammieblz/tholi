# Reference API hostname. Replace every canonical occurrence and mount a
# matching operator-issued certificate. Synthetic QA certificates are not used.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr emerg;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    include /etc/nginx/tholi-proxy.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server {
        listen 8080 default_server;
        server_name _;
        return 421;
    }
    server {
        listen 8080;
        server_name api.example.test;
        return 308 https://api.example.test$request_uri;
    }
    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
        return 421;
    }
    server {
        listen 8443 ssl;
        server_name api.example.test;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        set $tholi_upstream api:8788;
        include /etc/nginx/tholi-api.conf;
    }
}

# Compose 2.24.4+ overlay over the root compose.yaml. Reuses the API image,
# application network and operator-configured services. Configure production
# origins, OIDC and credentials separately before exposing this profile.
services:
  gateway:
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes: !override
      - ./infra/vm/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/local/gateway/proxy.conf:/etc/nginx/tholi-proxy.conf:ro
      - ./infra/local/gateway/api.conf:/etc/nginx/tholi-api.conf:ro
      - ./infra/local/gateway/upstream.conf:/etc/nginx/tholi-upstream.conf:ro
      # Directory must be readable by gateway uid/gid 101 and protected from
      # other host users. Renew in place, then validate and reload the gateway.
      - ${THOLI_TLS_DIRECTORY:?Mount operator-issued certificates}:/etc/nginx/tls:ro
    healthcheck:
      test: [CMD, nginx, -t]

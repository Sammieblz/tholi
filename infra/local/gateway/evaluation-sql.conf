# Development-only fixed SQL destination. No credentials or general forward proxy.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr emerg;
events { worker_connections 32; }
stream {
    server {
        listen 5432;
        proxy_connect_timeout 3s;
        proxy_timeout 35s;
        proxy_pass postgres:5432;
    }
}

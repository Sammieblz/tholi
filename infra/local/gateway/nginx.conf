worker_processes 1;
pid /tmp/nginx.pid;
# Startup failures remain visible. Request errors may contain private URLs, so
# ordinary per-request and access logs are disabled in this local gateway.
error_log /dev/stderr emerg;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Resolve only the four fixed Docker service names at request time.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    include /etc/nginx/tholi-proxy.conf;

    server {
        listen 8788;
        set $tholi_upstream api:8788;
        include /etc/nginx/tholi-api.conf;
    }
    server {
        listen 18080;
        set $tholi_upstream oidc:8080;
        include /etc/nginx/tholi-upstream.conf;
    }
    server {
        listen 18025;
        set $tholi_upstream mail:8025;
        include /etc/nginx/tholi-upstream.conf;
    }
    server {
        listen 18333;
        set $tholi_upstream storage:8333;
        include /etc/nginx/tholi-upstream.conf;
    }
}

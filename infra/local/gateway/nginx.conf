worker_processes 1;
pid /tmp/nginx.pid;
# Startup failures remain visible. Request errors may contain private URLs, so
# ordinary per-request and access logs are disabled in this local gateway.
error_log /dev/stderr emerg;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Resolve only the four configured Docker service names at request time.
    # Optional storage may be absent when the default stack starts.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;
    proxy_http_version 1.1;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Keep the original host, port and raw request URI for S3 signatures and
    # canonical local identity URLs. Forwarded values replace client input.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    server {
        listen 8788;
        set $tholi_upstream api:8788;
        include /etc/nginx/tholi-upstream.conf;
    }
    server {
        listen 18080;
        set $tholi_upstream oidc:8080;
        include /etc/nginx/tholi-upstream.conf;
    }
    server {
        listen 18025;
        set $tholi_upstream mail:8025;
        include /etc/nginx/tholi-upstream.conf;
    }
    server {
        listen 18333;
        set $tholi_upstream storage:8333;
        include /etc/nginx/tholi-upstream.conf;
    }
}

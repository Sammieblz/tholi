# Server-context service profile. Smaller route limits remain API-owned.
client_max_body_size 512k;
limit_req zone=tholi_api burst=40 nodelay;

# Keep the ordinary account/status/cancel allowance unchanged. Only this exact
# UUID-scoped collection POST carries the bounded ephemeral observation envelope.
location ~ "^/api/v1/workspaces/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/decisions$" {
    client_max_body_size 4m;
    if ($tholi_navigation_unexpected_body) { return 413; }
    # All forwarding, privacy, deadlines and no-retry controls are inherited from
    # the shared HTTP-context policy. The server fixes this upstream destination.
    proxy_pass http://$tholi_upstream;
}
include /etc/nginx/tholi-upstream.conf;

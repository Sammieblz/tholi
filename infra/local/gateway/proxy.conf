# Shared HTTP-context policy for the local gateway and the VM TLS proxy.
map "$status:$upstream_status" $tholi_retry_after {
    "429:" "1";
    default "";
}
# Only the decision POST may use its larger upload allowance. Bodyless OPTIONS
# still reaches the shared CORS handler; other methods cannot upload a body to
# this collection endpoint, including requests using chunked transfer encoding.
map "$request_method:$http_content_length:$http_transfer_encoding" $tholi_navigation_unexpected_body {
    default 1;
    ~^POST:[0-9]*:[^:]*$ 0;
    ~^[^:]+:0*:$ 0;
}
limit_req_zone $binary_remote_addr zone=tholi_api:1m rate=120r/m;
limit_req_status 429;
limit_req_log_level error;

proxy_connect_timeout 2s;
# The application owns its 25 s deadline. The proxy must allow its response.
proxy_read_timeout 35s;
proxy_send_timeout 35s;
proxy_request_buffering off;
proxy_buffering off;
proxy_cache off;
proxy_next_upstream off;
proxy_http_version 1.1;
proxy_set_header Upgrade "";
proxy_set_header Connection "";
# Preserve Host and the raw URI for private S3 signatures. None of these values
# chooses an upstream; the including server fixes that destination.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Request-Id $request_id;
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header X-Client-IP "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";

# This proxy serves APIs and private development tools, never public assets.
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Retry-After $tholi_retry_after always;

# Included only by the four fixed server blocks in nginx.conf. Client values
# never select the scheme, host or port of the upstream.
location / {
    proxy_pass http://$tholi_upstream$request_uri;
}

error_page 502 504 =503 @unavailable;
location @unavailable {
    default_type text/plain;
    return 503 "Local upstream unavailable.\n";
}

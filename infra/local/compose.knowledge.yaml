# Explicit local extraction profile. No provider calls, public ports or credentials.
services:
  api:
    environment:
      THOLI_DOCUMENT_CONVERTER_ORIGIN: http://document-converter:8796
      THOLI_PUBLIC_DOCUMENTATION_FETCHER_ORIGIN: http://public-doc-fetcher:8797
      THOLI_PUBLIC_DOCUMENTATION_CRAWLING: "true"
    networks: [application, extraction, public-crawl-internal]
    depends_on:
      public-doc-fetcher: { condition: service_healthy }
  document-converter:
    image: ${COMPOSE_PROJECT_NAME:-tholi-local}-api:dev
    command: [node, apps/api/dist/document-converter.js]
    user: "1000:1000"
    environment: { NODE_ENV: production, NODE_OPTIONS: --max-old-space-size=64 }
    networks: [extraction]
    read_only: true
    tmpfs: [/tmp:rw, noexec, nosuid, size=16m, mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 384m
    cpus: 1
    stop_grace_period: 10s
  public-doc-fetcher:
    image: ${COMPOSE_PROJECT_NAME:-tholi-local}-api:dev
    command: [node, apps/api/dist/adapters/public-documentation-fetcher.js]
    user: "1000:1000"
    environment: { NODE_ENV: production, NODE_OPTIONS: --max-old-space-size=128 }
    networks: [public-crawl-internal, public-crawl-egress]
    read_only: true
    tmpfs: [/tmp:rw, noexec, nosuid, size=16m, mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          CMD,
          node,
          --input-type=module,
          -e,
          "const r=await fetch('http://127.0.0.1:8797/health/ready',{signal:AbortSignal.timeout(2000)});process.exit(r.ok?0:1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  extraction: { internal: true }
  public-crawl-internal: { internal: true }
  public-crawl-egress: {}

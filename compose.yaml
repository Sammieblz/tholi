name: tholi-local

x-api-image: &api-image
  image: ${COMPOSE_PROJECT_NAME:-tholi-local}-api:dev
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: runtime

x-support-storage: &support-storage
  THOLI_SUPPORT_ENABLED: "true"
  THOLI_OBJECT_ENDPOINT: http://storage:8333
  THOLI_OBJECT_REGION: us-east-1
  THOLI_OBJECT_BUCKET: tholi-local
  THOLI_OBJECT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Initialize local storage credentials first}
  THOLI_OBJECT_SECRET_KEY: ${STORAGE_SECRET_KEY:?Initialize local storage credentials first}

x-observability: &observability
  THOLI_OBSERVABILITY_ENABLED: ${THOLI_OBSERVABILITY_ENABLED:-false}
  THOLI_OTLP_ENDPOINT: http://telemetry:4318
  THOLI_OTLP_ALLOW_LOCAL: "true"

x-operational-logging: &operational-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  gateway:
    image: nginx/nginx-unprivileged:1.30.6-alpine-slim@sha256:984a21e29bb10d4c0e122374b97b89a2101823a9331e0f3c6c04bc285ccf447f
    user: "101:101"
    entrypoint: [nginx]
    command: ["-g", "daemon off;"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8788}:8788"
      - "127.0.0.1:${OIDC_HOST_PORT:-18080}:18080"
      - "127.0.0.1:${MAIL_HOST_PORT:-18025}:18025"
      - "127.0.0.1:${STORAGE_HOST_PORT:-18333}:18333"
    volumes:
      - ./infra/local/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/local/gateway/proxy.conf:/etc/nginx/tholi-proxy.conf:ro
      - ./infra/local/gateway/api.conf:/etc/nginx/tholi-api.conf:ro
      - ./infra/local/gateway/upstream.conf:/etc/nginx/tholi-upstream.conf:ro
    networks: [ingress, application]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.5
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:8788/health/ready
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *api-image
    logging: *operational-logging
    user: "1000:1000"
    command: ["node", "apps/api/dist/service.js"]
    environment:
      <<: [*support-storage, *observability]
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=192
      THOLI_SERVICE_HOST: 0.0.0.0
      THOLI_SERVICE_PORT: "8788"
      THOLI_SERVICE_ORIGINS: ${THOLI_WEB_ORIGIN:-http://127.0.0.1:5174}
      THOLI_MODEL_PROVIDER: fake
      THOLI_DATABASE_URL: postgresql://tholi_runtime:${THOLI_DB_PASSWORD:?Initialize the local environment first}@postgres:5432/tholi
      THOLI_IDENTITY_ISSUER: http://localhost:${OIDC_HOST_PORT:-18080}/realms/tholi-local
      THOLI_IDENTITY_AUTHORIZATION_ENDPOINT: http://localhost:${OIDC_HOST_PORT:-18080}/realms/tholi-local/protocol/openid-connect/auth
      THOLI_IDENTITY_TOKEN_ENDPOINT: http://oidc:8080/realms/tholi-local/protocol/openid-connect/token
      THOLI_IDENTITY_JWKS_URI: http://oidc:8080/realms/tholi-local/protocol/openid-connect/certs
      THOLI_IDENTITY_LOGOUT_ENDPOINT: http://localhost:${OIDC_HOST_PORT:-18080}/realms/tholi-local/protocol/openid-connect/logout
      THOLI_IDENTITY_CLIENT_ID: tholi-service
      THOLI_IDENTITY_CLIENT_SECRET_KEY: ${THOLI_IDENTITY_CLIENT_SECRET_KEY:?Initialize local identity credentials first}
      THOLI_IDENTITY_FLOW_SECRET_KEY: ${THOLI_IDENTITY_FLOW_SECRET_KEY:?Initialize local identity credentials first}
      THOLI_SERVICE_PUBLIC_ORIGIN: http://127.0.0.1:${API_HOST_PORT:-8788}
      THOLI_FILE_LINK_SECRET_KEY: ${THOLI_FILE_LINK_SECRET_KEY:?Upgrade the local environment for support credentials}
      THOLI_IDENTITY_WEB_ORIGIN: ${THOLI_WEB_ORIGIN:-http://127.0.0.1:5174}
      THOLI_IDENTITY_CHROMIUM_CALLBACKS: ${THOLI_IDENTITY_CHROMIUM_CALLBACKS:-}
      THOLI_IDENTITY_FIREFOX_CALLBACKS: ${THOLI_IDENTITY_FIREFOX_CALLBACKS:-}
    networks: [application, database]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "const response = await fetch('http://127.0.0.1:8788/health/ready', { signal: AbortSignal.timeout(2000) }); process.exit(response.ok ? 0 : 1);"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      oidc: { condition: service_healthy }
      mail: { condition: service_healthy }
      storage: { condition: service_healthy }
      database-migrate: { condition: service_completed_successfully }
      identity-configure: { condition: service_completed_successfully }

  worker:
    <<: *api-image
    logging: *operational-logging
    user: "1000:1000"
    command: [node, apps/api/dist/worker.js]
    environment:
      <<: [*support-storage, *observability]
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=192
      THOLI_DATABASE_WORKER_URL: postgresql://tholi_worker:${THOLI_WORKER_PASSWORD:?Upgrade the local environment for worker credentials}@postgres:5432/tholi
      THOLI_WORKER_HEALTH_FILE: /tmp/tholi-worker-health.json
      THOLI_SMTP_HOST: mail
      THOLI_SMTP_PORT: "1025"
      THOLI_SMTP_SECURE: "false"
      THOLI_SMTP_REQUIRE_TLS: "false"
      THOLI_SMTP_LOCAL_CAPTURE: "true"
      THOLI_SMTP_FROM: tholi@example.invalid
      THOLI_SMTP_SUPPORT_RECIPIENT: support@example.invalid
    networks: [database, application]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 32
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, node, apps/api/dist/worker.js, --health]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      mail: { condition: service_healthy }
      storage: { condition: service_healthy }
      database-migrate: { condition: service_completed_successfully }

  # Local operator-owned initialization, never performed by an HTTP replica.
  database-migrate:
    <<: *api-image
    user: "1000:1000"
    command: [node, apps/api/dist/database-cli.js, migrate]
    environment:
      THOLI_DATABASE_MIGRATION_URL: postgresql://tholi_migrator:${THOLI_MIGRATION_PASSWORD:?Initialize the local environment first}@postgres:5432/tholi
      THOLI_DATABASE_RUNTIME_ROLE: tholi_runtime
      THOLI_DATABASE_WORKER_ROLE: tholi_worker
    networks: [database]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 256m
    cpus: 1
    depends_on:
      postgres: { condition: service_healthy }

  identity-configure:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    entrypoint: [bash, /opt/keycloak/data/seed.sh]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: tholi-local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC_ADMIN_PASSWORD:?Initialize the local environment first}
      OIDC_TEST_PASSWORD: ${OIDC_TEST_PASSWORD:?Initialize the local environment first}
      OIDC_ADMIN_URL: http://oidc:8080
      THOLI_IDENTITY_CLIENT_SECRET_KEY: ${THOLI_IDENTITY_CLIENT_SECRET_KEY:?Initialize local identity credentials first}
      THOLI_SERVICE_PUBLIC_ORIGIN: http://127.0.0.1:${API_HOST_PORT:-8788}
      THOLI_WEB_ORIGIN: ${THOLI_WEB_ORIGIN:-http://127.0.0.1:5174}
    volumes:
      - ./infra/local/oidc/tholi-local-realm.json:/opt/keycloak/data/import/tholi-local-realm.json:ro
      - ./infra/local/oidc/seed.sh:/opt/keycloak/data/seed.sh:ro
    networks: [application]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    depends_on:
      oidc: { condition: service_healthy }

  # Operator-only commands. Migration credentials never enter the HTTP service.
  database-tools:
    <<: *api-image
    profiles: [tools]
    entrypoint: [node, apps/api/dist/database-cli.js]
    command: [verify]
    user: "1000:1000"
    environment:
      NODE_ENV: development
      THOLI_ALLOW_DEV_SEED: "true"
      THOLI_DATABASE_URL: postgresql://tholi_runtime:${THOLI_DB_PASSWORD:?Initialize the local environment first}@postgres:5432/tholi
      THOLI_DATABASE_MIGRATION_URL: postgresql://tholi_migrator:${THOLI_MIGRATION_PASSWORD:?Initialize the local environment first}@postgres:5432/tholi
      THOLI_DATABASE_RUNTIME_ROLE: tholi_runtime
      THOLI_DATABASE_WORKER_ROLE: tholi_worker
    networks: [database]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 256m
    cpus: 1
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=64MB
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Initialize the local environment first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
      THOLI_DB_PASSWORD: ${THOLI_DB_PASSWORD:?Initialize the local environment first}
      THOLI_WORKER_PASSWORD: ${THOLI_WORKER_PASSWORD:?Upgrade the local environment for worker credentials}
      THOLI_MIGRATION_PASSWORD: ${THOLI_MIGRATION_PASSWORD:?Initialize the local environment first}
      OIDC_DB_PASSWORD: ${OIDC_DB_PASSWORD:?Initialize the local environment first}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/local/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/bootstrap.sh:ro
      - ./infra/local/postgres/bootstrap.sql:/opt/tholi/postgres/bootstrap.sql:ro
    networks: [database]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "postgres",
          "-d",
          "postgres",
        ]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s

  oidc:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/tholi_identity
      KC_DB_USERNAME: tholi_identity
      KC_DB_PASSWORD: ${OIDC_DB_PASSWORD:?Initialize the local environment first}
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "6"
      KC_BOOTSTRAP_ADMIN_USERNAME: tholi-local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC_ADMIN_PASSWORD:?Initialize the local environment first}
      KC_HOSTNAME: http://localhost:${OIDC_HOST_PORT:-18080}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      OIDC_TEST_PASSWORD: ${OIDC_TEST_PASSWORD:?Initialize the local environment first}
      THOLI_IDENTITY_CLIENT_SECRET_KEY: ${THOLI_IDENTITY_CLIENT_SECRET_KEY:?Initialize local identity credentials first}
      THOLI_SERVICE_PUBLIC_ORIGIN: http://127.0.0.1:${API_HOST_PORT:-8788}
      THOLI_WEB_ORIGIN: ${THOLI_WEB_ORIGIN:-http://127.0.0.1:5174}
    volumes:
      - ./infra/local/oidc/tholi-local-realm.json:/opt/keycloak/data/import/tholi-local-realm.json:ro
      - ./infra/local/oidc/seed.sh:/opt/keycloak/data/seed.sh:ro
    networks: [application, database]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }

  mail:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_MAX_AGE: 7d
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_LABEL: Tholi local capture
    volumes:
      - mail-data:/data
    networks: [application]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  storage:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    user: "1000:1000"
    command:
      [
        "mini",
        "-dir=/data",
        "-ip=storage",
        "-ip.bind=0.0.0.0",
        "-master.telemetry=false",
        "-webdav=false",
        "-admin.ui=false",
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?Initialize local storage credentials first}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Initialize local storage credentials first}
      S3_BUCKET: tholi-local
    volumes:
      - storage-data:/data
      - ./infra/local/storage/health.sh:/opt/tholi/storage-health.sh:ro
    networks: [application]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "sh", "/opt/tholi/storage-health.sh"]
      interval: 5s
      timeout: 6s
      retries: 18
      start_period: 20s

  telemetry:
    profiles: [telemetry]
    image: otel/opentelemetry-collector:0.164.0@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/local/telemetry/collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [application]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging: *operational-logging
    # The official scratch image has no HTTP client. The smoke command probes
    # its actual health endpoint at telemetry:13133 from the API container.

networks:
  ingress:
  application:
    internal: true
  database:
    internal: true

volumes:
  postgres-data:
  mail-data:
  storage-data:

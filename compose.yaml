name: tholi-local

services:
  gateway:
    image: nginx/nginx-unprivileged:1.30.6-alpine-slim@sha256:984a21e29bb10d4c0e122374b97b89a2101823a9331e0f3c6c04bc285ccf447f
    user: "101:101"
    entrypoint: [nginx]
    command: ["-g", "daemon off;"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8788}:8788"
      - "127.0.0.1:${OIDC_HOST_PORT:-18080}:18080"
      - "127.0.0.1:${MAIL_HOST_PORT:-18025}:18025"
      - "127.0.0.1:${STORAGE_HOST_PORT:-18333}:18333"
    volumes:
      - ./infra/local/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/local/gateway/upstream.conf:/etc/nginx/tholi-upstream.conf:ro
    networks: [ingress, application]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.5
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:8788/health/ready
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      api: { condition: service_healthy }

  api:
    image: ${COMPOSE_PROJECT_NAME:-tholi-local}-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    user: "1000:1000"
    command: ["node", "apps/api/dist/service.js"]
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=192
      THOLI_SERVICE_HOST: 0.0.0.0
      THOLI_SERVICE_PORT: "8788"
      THOLI_SERVICE_ORIGINS: ${THOLI_WEB_ORIGIN:-http://127.0.0.1:5174}
      THOLI_MODEL_PROVIDER: fake
    networks: [application]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "const response = await fetch('http://127.0.0.1:8788/health/ready', { signal: AbortSignal.timeout(2000) }); process.exit(response.ok ? 0 : 1);"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      oidc: { condition: service_healthy }
      mail: { condition: service_healthy }

  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=64MB
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Initialize the local environment first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
      THOLI_DB_PASSWORD: ${THOLI_DB_PASSWORD:?Initialize the local environment first}
      THOLI_MIGRATION_PASSWORD: ${THOLI_MIGRATION_PASSWORD:?Initialize the local environment first}
      OIDC_DB_PASSWORD: ${OIDC_DB_PASSWORD:?Initialize the local environment first}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/local/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/bootstrap.sh:ro
      - ./infra/local/postgres/bootstrap.sql:/opt/tholi/postgres/bootstrap.sql:ro
    networks: [database]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "postgres",
          "-d",
          "postgres",
        ]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s

  oidc:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/tholi_identity
      KC_DB_USERNAME: tholi_identity
      KC_DB_PASSWORD: ${OIDC_DB_PASSWORD:?Initialize the local environment first}
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "6"
      KC_BOOTSTRAP_ADMIN_USERNAME: tholi-local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC_ADMIN_PASSWORD:?Initialize the local environment first}
      KC_HOSTNAME: http://localhost:${OIDC_HOST_PORT:-18080}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      OIDC_TEST_PASSWORD: ${OIDC_TEST_PASSWORD:?Initialize the local environment first}
    volumes:
      - ./infra/local/oidc/tholi-local-realm.json:/opt/keycloak/data/import/tholi-local-realm.json:ro
      - ./infra/local/oidc/seed.sh:/opt/keycloak/data/seed.sh:ro
    networks: [application, database]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }

  mail:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_MAX_AGE: 7d
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_LABEL: Tholi local capture
    volumes:
      - mail-data:/data
    networks: [application]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  storage:
    profiles: [storage]
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    user: "1000:1000"
    command:
      [
        "mini",
        "-dir=/data",
        "-ip=storage",
        "-ip.bind=0.0.0.0",
        "-master.telemetry=false",
        "-webdav=false",
        "-admin.ui=false",
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?Initialize local storage credentials first}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Initialize local storage credentials first}
      S3_BUCKET: tholi-local
    volumes:
      - storage-data:/data
      - ./infra/local/storage/health.sh:/opt/tholi/storage-health.sh:ro
    networks: [application]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "sh", "/opt/tholi/storage-health.sh"]
      interval: 5s
      timeout: 6s
      retries: 18
      start_period: 20s

  telemetry:
    profiles: [telemetry]
    image: otel/opentelemetry-collector:0.164.0@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/local/telemetry/collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [application]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    # The official scratch image has no HTTP client. The smoke command probes
    # its actual health endpoint at telemetry:13133 from the API container.

networks:
  ingress:
  application:
    internal: true
  database:
    internal: true

volumes:
  postgres-data:
  mail-data:
  storage-data:

<!doctype html>
<html lang="en" data-tholi-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script>
      // Apply only a current, explicit appearance choice before styles paint.
      // No OS lookup or preference storage is performed during startup.
      try {
        const read = (name) => {
          const part = document.cookie
            .split(";")
            .map((value) => value.trim())
            .find((value) => value.startsWith(name + "="));
          return part ? decodeURIComponent(part.slice(name.length + 1)) : null;
        };
        const raw = read("tholi_consent");
        const choice = raw && raw.length <= 2048 ? JSON.parse(raw) : null;
        const now = Date.now();
        const valid =
          choice &&
          choice.version === 1 &&
          choice.preferences === true &&
          Number.isFinite(choice.savedAt) &&
          Number.isFinite(choice.expiresAt) &&
          choice.savedAt <= now + 60000 &&
          choice.expiresAt > now &&
          choice.expiresAt > choice.savedAt &&
          choice.expiresAt - choice.savedAt <= 15552000000 &&
          (choice.analytics === null ||
            (choice.analytics &&
              typeof choice.analytics === "object" &&
              typeof choice.analytics.provider === "string" &&
              /^[a-z0-9-]{1,64}$/.test(choice.analytics.provider) &&
              typeof choice.analytics.disclosure === "string" &&
              /^[a-zA-Z0-9._-]{1,64}$/.test(choice.analytics.disclosure) &&
              typeof choice.analytics.allowed === "boolean"));
        if (valid && read("tholi_theme") === "light") {
          document.documentElement.dataset.tholiTheme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      } catch {
        /* Dark remains usable when cookies are unavailable. */
      }
    </script>
    <!-- tholi:seo:start -->
    <!-- tholi:seo:end -->
    <meta name="application-name" content="Tholi" />
    <meta name="apple-mobile-web-app-title" content="Tholi" />
    <meta name="theme-color" content="#101c17" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/icons/favicon-96.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <noscript
      ><style>
        button,
        .demo,
        .cookie-banner,
        .contact-form-area form {
          display: none !important;
        }
      </style></noscript
    >
  </head>
  <body>
    <noscript
      ><p>
        Installation links and documentation work without JavaScript.
        Interactive controls need JavaScript. For support, email
        <a href="mailto:info@ilunonsen.com">info@ilunonsen.com</a>.
      </p></noscript
    >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
